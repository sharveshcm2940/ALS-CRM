services:
  - type: web
    name: als-crm-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COMPANY_TIMEZONE
        value: Asia/Kolkata
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: als_crm
      - key: DB_SSL
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: COOKIE_SAMESITE
        value: "none"
